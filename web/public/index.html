<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job Scout</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Job Scout">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root {
  --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --muted: #64748b; --line: #e2e8f0;
  --accent: #0284c7; --accent-text: #ffffff; --good: #15803d; --warn: #b45309; --bad: #b91c1c;
  --chip: #e2e8f0;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1220; --card: #162033; --text: #e2e8f0; --muted: #94a3b8; --line: #243049;
    --accent: #38bdf8; --accent-text: #0b1220; --good: #86efac; --warn: #fcd34d; --bad: #fca5a5;
    --chip: #243049;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
body { padding: env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom)); min-height: 100vh; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 14px 16px 8px; display: flex;
  align-items: center; justify-content: space-between; gap: 8px; }
h1 { font-size: 22px; margin: 0; }
.sub { color: var(--muted); font-size: 13px; }
main { padding: 0 16px 16px; max-width: 640px; margin: 0 auto; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 10px 0; }
.card a { color: inherit; text-decoration: none; display: block; }
.row { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.company { font-weight: 650; }
.title { color: var(--text); font-size: 15px; }
.meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
.badge { display: inline-block; font-size: 12px; font-weight: 650; padding: 2px 8px; border-radius: 999px; background: var(--chip); white-space: nowrap; }
.badge.ws { background: var(--accent); color: var(--accent-text); }
.score { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 0; background: var(--chip); color: var(--text); padding: 8px 14px; border-radius: 999px; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); font-weight: 650; }
input[type=search], input[type=password], input[type=text], input[type=url], input[type=number], textarea { width: 100%; font-size: 16px; padding: 12px 14px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--card); color: var(--text); }
button.primary { width: 100%; margin-top: 12px; font-size: 17px; font-weight: 650; padding: 13px; border: 0;
  border-radius: 12px; background: var(--accent); color: var(--accent-text); }
button.icon { border: 0; background: var(--chip); color: var(--text); border-radius: 999px; padding: 8px 14px; font-size: 14px; }
select.sort { width: 100%; font-size: 15px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); margin-bottom: 2px; }
.group { margin: 18px 0 4px; font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.stat b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
.bar { height: 10px; border-radius: 999px; background: var(--chip); overflow: hidden; margin-top: 8px; }
.bar > span { display: block; height: 100%; background: var(--accent); }
.bar.over > span { background: var(--bad); }
.empty, .error { color: var(--muted); text-align: center; padding: 28px 8px; }
.error { color: var(--bad); }
.badge.closed { background: var(--bad); color: #fff; }
.card.is-closed { border-color: var(--bad); }
textarea { min-height: 120px; resize: vertical; font-family: inherit; }
.field { margin: 8px 0; }
details > summary { cursor: pointer; color: var(--accent); padding: 8px 0; }
.back { border: 0; background: none; color: var(--accent); font-size: 16px; padding: 4px 0 10px; }
.btn { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--card);
  color: var(--text); font-size: 16px; padding: 13px 14px; border-radius: 12px; margin: 8px 0; text-decoration: none; }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 650; }
.btn[disabled] { opacity: .5; }
.statusrow { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.letter { white-space: pre-wrap; font-size: 15px; line-height: 1.5; }
.gap { margin: 10px 0; }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom)); background: var(--text);
  color: var(--bg); padding: 12px 14px; border-radius: 12px; text-align: center; z-index: 10; }
.pill-new { color: var(--good); font-weight: 700; font-size: 12px; }
nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--card); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom); }
nav button { flex: 1; border: 0; background: none; color: var(--muted); padding: 10px 0 8px; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
nav button span { font-size: 22px; line-height: 1; }
nav button[aria-current="page"] { color: var(--accent); font-weight: 700; }
#login { padding: 64px 24px; max-width: 420px; margin: 0 auto; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<section id="login" hidden>
  <h1>Job Scout</h1>
  <p class="sub">Bitte Passwort eingeben.</p>
  <form id="login-form">
    <input id="pw" type="password" autocomplete="current-password" placeholder="Passwort" aria-label="Passwort" required>
    <button class="primary" type="submit">Anmelden</button>
  </form>
  <p id="login-error" class="error" hidden></p>
</section>

<div id="app" hidden>
  <header>
    <div><h1 id="head-title">Bewerbungen</h1><div class="sub" id="head-sub"></div></div>
    <button class="icon" id="refresh" type="button">↻ Neu laden</button>
  </header>
  <main id="view"></main>
  <nav>
    <button data-tab="apps" aria-current="page"><span>📨</span>Bewerbungen</button>
    <button data-tab="jobs"><span>🔎</span>Stellen</button>
    <button data-tab="status"><span>📊</span>Status</button>
  </nav>
</div>

<script>
"use strict";
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const ORDER = ["angebot", "interview", "beworben", "paket", "gemerkt", "absage"];
const TITLES = { apps: "Bewerbungen", jobs: "Stellen", status: "Status" };
const state = { data: null, detail: null, tab: "apps", filter: "all", query: "", appFilter: "all", appSort: "status" };
const $ = (id) => document.getElementById(id);

function h(tag, attrs, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") node.className = v; else if (v !== false && v != null) node.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) node.append(kid);
  return node;
}
const safeUrl = (u) => (/^https?:\/\//i.test(u || "") ? u : null);
const date = (iso) => (iso ? new Date(iso).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" }) : "");

async function load() {
  const pw = store.get("pw");
  if (!pw) return showLogin();
  $("refresh").disabled = true;
  try {
    const res = await fetch("/api/dashboard", { headers: { "x-dashboard-password": pw }, cache: "no-store" });
    if (res.status === 401) { store.del("pw"); return showLogin("Passwort falsch."); }
    if (!res.ok) throw new Error(String(res.status));
    state.data = await res.json();
    $("login").hidden = true; $("app").hidden = false;
    render();
  } catch {
    if (state.data) { render(); $("head-sub").textContent = "Offline – alte Daten"; }
    else { $("app").hidden = false; $("login").hidden = true; $("view").replaceChildren(h("p", { class: "error" }, "Daten konnten nicht geladen werden. Bitte „Neu laden“ tippen.")); }
  } finally { $("refresh").disabled = false; }
}

function showLogin(msg) {
  $("app").hidden = true; $("login").hidden = false;
  const err = $("login-error"); err.hidden = !msg; err.textContent = msg || "";
}

function jobCard(j) {
  const link = safeUrl(j.url);
  const body = [
    h("div", { class: "row" },
      h("div", {}, h("div", { class: "company" }, j.company), h("div", { class: "title" }, j.title)),
      h("div", { class: "score" }, `${j.fit}/${j.reach}`)),
    h("div", { class: "meta" },
      j.manual ? [h("span", { class: "badge" }, "Selbst gefunden"), " "] : null,
      j.kind === "working_student" ? h("span", { class: "badge ws" }, "Werkstudent") : null,
      j.kind === "working_student" ? " " : "",
      [j.location || (j.remote ? "Remote" : ""), j.ring ? `Ring: ${j.ring}` : ""].filter(Boolean).join(" · "),
      !j.seen ? [" ", h("span", { class: "pill-new" }, "● neu")] : null),
  ];
  const build = h("button", { class: "chip", type: "button" }, "📦 Paket bauen");
  build.addEventListener("click", () => startBuild(j.id, "de", false));
  return h("div", { class: "card" }, link ? h("a", { href: link, target: "_blank", rel: "noopener noreferrer" }, body) : body, h("div", { class: "statusrow" }, build));
}

function appCard(a) {
  const body = [
    h("div", { class: "company" }, a.company),
    h("div", { class: "title" }, a.title),
    h("div", { class: "meta" },
      a.closed ? [h("span", { class: "badge closed" }, "Stelle geschlossen"), " "] : null,
      [a.appliedAt ? `Beworben ${date(a.appliedAt)}` : `Aktualisiert ${date(a.updatedAt)}`, a.hasPackage ? "📦 Paket" : ""].filter(Boolean).join(" · ")),
  ];
  const card = h("div", { class: "card" + (a.closed ? " is-closed" : ""), role: "button", tabindex: "0" }, body);
  card.addEventListener("click", () => { location.hash = `#/app/${a.id}`; });
  return card;
}

function renderApps() {
  const { applications, statusLabels } = state.data;
  const view = h("div", {});
  if (!applications.length) {
    view.append(h("p", { class: "empty" }, "Noch keine Bewerbungen. Tippe in Telegram auf 👀 Merken oder 📦 Paket."));
    return view;
  }
  const present = ORDER.filter((s) => applications.some((a) => a.status === s));
  const closedCount = applications.filter((a) => a.closed).length;
  if (state.appFilter !== "all" && state.appFilter !== "closed" && !present.includes(state.appFilter)) state.appFilter = "all";
  if (state.appFilter === "closed" && !closedCount) state.appFilter = "all";
  const chip = (key, label) => {
    const b = h("button", { class: "chip", type: "button", "aria-pressed": String(state.appFilter === key) }, label);
    b.addEventListener("click", () => { state.appFilter = key; render(); });
    return b;
  };
  view.append(h("div", { class: "chips" },
    chip("all", `Alle ${applications.length}`),
    closedCount ? chip("closed", `⚠️ Geschlossen ${closedCount}`) : null,
    present.map((s) => chip(s, `${statusLabels[s].icon} ${statusLabels[s].label} ${applications.filter((a) => a.status === s).length}`))));
  const sort = h("select", { "aria-label": "Sortierung", class: "sort" },
    h("option", { value: "status" }, "Sortieren: nach Status"),
    h("option", { value: "recent" }, "Sortieren: zuletzt geändert"),
    h("option", { value: "company" }, "Sortieren: Firma A–Z"));
  sort.value = state.appSort;
  sort.addEventListener("change", () => { state.appSort = sort.value; render(); });
  view.append(sort);

  const shown = applications.filter((a) =>
    state.appFilter === "all" || (state.appFilter === "closed" ? a.closed : a.status === state.appFilter));
  if (state.appSort === "status" && state.appFilter === "all") {
    for (const status of present) {
      view.append(h("div", { class: "group" }, `${statusLabels[status].icon} ${statusLabels[status].label}`));
      for (const a of shown.filter((x) => x.status === status)) view.append(appCard(a));
    }
    return view;
  }
  const sorted = [...shown].sort(state.appSort === "company"
    ? (a, b) => a.company.localeCompare(b.company, "de")
    : (a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));
  for (const a of sorted) view.append(appCard(a));
  return view;
}

function addJobCard() {
  const url = h("input", { type: "url", placeholder: "Link zur Stelle einfügen", "aria-label": "Link zur Stelle", autocapitalize: "off", inputmode: "url" });
  const go = h("button", { class: "btn primary", type: "button" }, "Aufnehmen");
  const company = h("input", { type: "text", placeholder: "Firma", "aria-label": "Firma" });
  const title = h("input", { type: "text", placeholder: "Jobtitel", "aria-label": "Jobtitel" });
  const text = h("textarea", { placeholder: "Anzeigentext hier einfügen", "aria-label": "Anzeigentext" });
  const goText = h("button", { class: "btn", type: "button" }, "Mit Text aufnehmen");
  async function send(body, clear) {
    try {
      await api("/api/import", { method: "POST", body: JSON.stringify(body) });
      toast("Wird gelesen. Die Stelle erscheint in etwa einer Minute hier.");
      clear.forEach((el) => { el.value = ""; });
      setTimeout(() => { if (store.get("pw")) load(); }, 70000);
    } catch (err) {
      toast(err.message.length > 90 ? "Das hat nicht geklappt." : err.message);
    }
  }
  go.addEventListener("click", () => { if (url.value.trim()) send({ url: url.value.trim() }, [url]); else toast("Bitte zuerst einen Link einfügen."); });
  goText.addEventListener("click", () => send({ company: company.value, title: title.value, description: text.value, url: url.value.trim() || undefined }, [company, title, text, url]));
  return h("div", { class: "card" },
    h("div", { class: "company" }, "➕ Stelle hinzufügen"),
    h("div", { class: "field" }, url), go,
    h("details", {}, h("summary", {}, "Link geht nicht? Text einfügen"),
      h("div", { class: "field" }, company), h("div", { class: "field" }, title), h("div", { class: "field" }, text), goText));
}

function renderJobs() {
  const d = state.data;
  const view = h("div", {});
  view.append(addJobCard());
  const filters = [["all", "Alle"], ["posting", "Vollzeit"], ["working_student", "Werkstudent"], ["new", "Neu"], ["initiative", "Initiativ"]];
  view.append(h("div", { class: "chips" }, filters.map(([key, label]) => {
    const b = h("button", { class: "chip", type: "button", "aria-pressed": String(state.filter === key) }, label);
    b.addEventListener("click", () => { state.filter = key; render(); });
    return b;
  })));
  const search = h("input", { type: "search", placeholder: "Firma oder Titel suchen", "aria-label": "Suche", value: state.query });
  search.addEventListener("input", () => { state.query = search.value; renderList(); });
  view.append(search);
  const list = h("div", {}); view.append(list);
  function renderList() {
    const q = state.query.trim().toLowerCase();
    const match = (...parts) => !q || parts.join(" ").toLowerCase().includes(q);
    let items;
    if (state.filter === "initiative") {
      items = d.initiatives.filter((i) => match(i.company, i.location)).map((i) => {
        const link = safeUrl(i.url);
        const body = [h("div", { class: "company" }, i.company), h("div", { class: "meta" }, i.location || "Initiativbewerbung")];
        return h("div", { class: "card" }, link ? h("a", { href: link, target: "_blank", rel: "noopener noreferrer" }, body) : body);
      });
    } else {
      items = d.jobs.filter((j) => (state.filter === "all" || (state.filter === "new" ? !j.seen : j.kind === state.filter)) && match(j.company, j.title, j.location)).map(jobCard);
    }
    list.replaceChildren(...(items.length ? items : [h("p", { class: "empty" }, "Keine Treffer.")]));
  }
  renderList();
  return view;
}

function creditCard() {
  const c = state.data.credit;
  const amount = h("input", { type: "text", inputmode: "decimal", placeholder: "Guthaben aus der Konsole, z. B. 18,40", "aria-label": "Guthaben" });
  const cur = h("select", { class: "sort", "aria-label": "Währung" }, h("option", { value: "USD" }, "US-Dollar ($)"), h("option", { value: "EUR" }, "Euro (€)"));
  const save = h("button", { class: "btn", type: "button" }, c ? "Guthaben neu eintragen" : "Guthaben eintragen");
  save.addEventListener("click", async () => {
    try {
      await api("/api/credit", { method: "POST", body: JSON.stringify({ amount: amount.value, currency: cur.value }) });
      toast("Guthaben gespeichert ✅");
      await load();
    } catch (err) { toast(err.message.length > 90 ? "Das hat nicht geklappt." : err.message); }
  });
  const body = [h("div", { class: "company" }, "💰 API-Guthaben")];
  if (c) {
    const low = c.percent < 20;
    body.push(
      h("div", { class: "row" }, h("div", { class: "score" }, `${c.remainingUsd.toFixed(2)} $`), h("div", { class: "sub" }, `≈ ${c.remainingEur.toFixed(2)} €`)),
      h("div", { class: "bar" + (low ? " over" : "") }, h("span", { style: `width:${Math.min(100, c.percent)}%` })),
      h("div", { class: "meta" }, `${c.percent} % von ${c.startUsd.toFixed(2)} $${c.setAt ? ` (eingetragen am ${date(c.setAt)})` : ""}${low ? " · wird knapp" : ""}`));
  } else {
    body.push(h("div", { class: "meta" }, "Noch nicht eingetragen. Trage dein Guthaben aus der Anthropic-Konsole ein, dann zählt die App ab da herunter."));
  }
  body.push(h("div", { class: "field" }, amount), h("div", { class: "field" }, cur), save);
  return h("div", { class: "card" }, body);
}

function renderStatus() {
  const s = state.data.status;
  const bar = h("div", { class: "bar" + (s.percent > 100 ? " over" : "") }, h("span", { style: `width:${Math.min(100, s.percent)}%` }));
  const stat = (n, label) => h("div", { class: "stat" }, h("b", {}, String(n)), h("span", { class: "sub" }, label));
  return h("div", {},
    h("div", { class: "card" }, h("div", { class: "row" }, h("div", { class: "company" }, "API-Kosten diesen Monat"), h("div", { class: "score" }, `${s.costEur.toFixed(2)} € / ${s.budgetEur} €`)), bar,
      h("div", { class: "meta" }, `${s.percent} % des Budgets (≈ ${s.costUsd.toFixed(2)} USD)`)),
    creditCard(),
    h("div", { class: "stats" }, stat(s.qualifying, "passende Stellen"), stat(s.unseen, "davon neu"), stat(s.openJobs, "offene Stellen gesamt"), stat(s.companies, "aktive Firmen"), stat(s.initiatives, "Initiativ-Firmen"), stat(Object.values(s.statuses).reduce((a, b) => a + b, 0), "Bewerbungen")),
    h("div", { class: "card" }, h("div", { class: "company" }, "Benachrichtigungen"), h("div", { class: "meta" }, s.paused ? "⏸ pausiert" : "✅ aktiv")),
    h("p", { class: "sub" }, `Stand: ${new Date(state.data.generatedAt).toLocaleString("de-DE")}`));
}

const STATUS_ORDER = ["beworben", "interview", "absage", "angebot"];

function toast(text) {
  const el = h("div", { class: "toast" }, text);
  document.body.append(el);
  setTimeout(() => el.remove(), 2600);
}

async function api(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: { "x-dashboard-password": store.get("pw") || "", "Content-Type": "application/json" },
    cache: "no-store",
  });
  if (res.status === 401) { store.del("pw"); showLogin("Passwort falsch."); throw new Error("unauthorized"); }
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || String(res.status));
  return body;
}

function pollDetail(id) {
  let n = 0;
  const timer = setInterval(() => {
    n += 1;
    if (state.detail !== id || n > 12) { clearInterval(timer); return; }
    render(true);
  }, 20000);
}

async function startBuild(id, language, stay) {
  try {
    await api("/api/package", { method: "POST", body: JSON.stringify({ id, language }) });
    toast(language === "en" ? "Englisches Paket wird gebaut. Es dauert 2 bis 3 Minuten." : "Paket wird gebaut. Es dauert 2 bis 3 Minuten.");
    if (stay) pollDetail(id);
  } catch (err) {
    toast(err.message.length > 90 ? "Das Paket konnte nicht gestartet werden." : err.message);
  }
}

async function openFile(id, kind) {
  // The window is opened right at the tap, so iOS does not block it after the request.
  const win = window.open("", "_blank");
  try {
    const { url } = await api(`/api/file?id=${id}&kind=${kind}`);
    if (win) win.location.href = url; else location.href = url;
  } catch {
    if (win) win.close();
    toast("Die Datei konnte nicht geöffnet werden.");
  }
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast("Kopiert ✅"); }
  catch { toast("Kopieren nicht möglich. Text markieren und kopieren."); }
}

async function changeStatus(id, status) {
  try {
    await api("/api/status", { method: "POST", body: JSON.stringify({ id, status }) });
    toast("Status gespeichert ✅");
    await load();
  } catch { toast("Der Status konnte nicht gespeichert werden."); }
}

function fileButton(id, kind, label, files) {
  if (!files[kind]) return null;
  const b = h("button", { class: "btn", type: "button" }, label);
  b.addEventListener("click", () => openFile(id, kind));
  return b;
}

async function renderDetail(id) {
  const view = h("div", {});
  const back = h("button", { class: "back", type: "button" }, "‹ Zurück");
  back.addEventListener("click", () => { location.hash = ""; });
  view.append(back);
  let d;
  try { d = await api(`/api/application?id=${id}`); }
  catch { view.append(h("p", { class: "error" }, "Diese Bewerbung konnte nicht geladen werden.")); return view; }
  const labels = state.data.statusLabels;
  view.append(h("div", { class: "card" + (d.closed ? " is-closed" : "") },
    h("div", { class: "company" }, d.company), h("div", { class: "title" }, d.title),
    h("div", { class: "meta" },
      d.closed ? [h("span", { class: "badge closed" }, "Stelle geschlossen"), " "] : null,
      `${labels[d.status].icon} ${labels[d.status].label}`,
      d.appliedAt ? ` · Beworben ${date(d.appliedAt)}` : "")));

  view.append(h("div", { class: "group" }, "Status ändern"));
  const reset = d.files.cv ? "paket" : "gemerkt";
  view.append(h("div", { class: "statusrow" }, [...STATUS_ORDER, reset].map((st) => {
    const b = h("button", { class: "chip", type: "button", "aria-pressed": String(d.status === st) },
      st === reset ? "↩️ Zurücksetzen" : `${labels[st].icon} ${labels[st].label}`);
    b.addEventListener("click", () => { if (d.status !== st) changeStatus(d.id, st); });
    return b;
  })));

  const files = [
    fileButton(d.id, "cv", "📄 Lebenslauf (PDF)", d.files), fileButton(d.id, "letter", "✉️ Anschreiben (PDF)", d.files),
    fileButton(d.id, "cv_en", "🇬🇧 Resume (PDF)", d.files), fileButton(d.id, "letter_en", "🇬🇧 Cover letter (PDF)", d.files),
  ].filter(Boolean);
  view.append(h("div", { class: "group" }, "Unterlagen"));
  view.append(...(files.length ? files : [h("p", { class: "empty" }, "Noch kein Paket gebaut.")]));
  const buildDe = h("button", { class: "btn", type: "button" }, d.files.cv ? "🔄 Deutsches Paket neu bauen" : "📦 Paket bauen (Deutsch)");
  buildDe.addEventListener("click", () => startBuild(d.id, "de", true));
  const buildEn = h("button", { class: "btn", type: "button", disabled: d.files.cv ? null : "disabled" }, d.files.cv_en ? "🇬🇧 Englische Fassung neu bauen" : "🇬🇧 Auf Englisch bauen");
  buildEn.addEventListener("click", () => startBuild(d.id, "en", true));
  view.append(buildDe, buildEn);
  if (!d.files.cv) view.append(h("p", { class: "sub" }, "Englisch ist eine Übersetzung des deutschen Pakets. Baue zuerst das deutsche."));
  const link = safeUrl(d.url);
  if (link) view.append(h("a", { class: "btn primary", href: link, target: "_blank", rel: "noopener noreferrer" }, "🔗 Anzeige öffnen"));

  if (d.coverLetter) {
    view.append(h("div", { class: "group" }, "Anschreiben (Text)"));
    const copy = h("button", { class: "btn", type: "button" }, "📋 Text kopieren");
    copy.addEventListener("click", () => copyText(d.coverLetter));
    view.append(h("div", { class: "card letter" }, d.coverLetter), copy);
  }
  if (d.gaps.length) {
    view.append(h("div", { class: "group" }, "Gap-Analyse"));
    const icon = { "erfüllt": "✅", teilweise: "🟡", fehlt: "❌" };
    view.append(h("div", { class: "card" }, d.gaps.map((g) =>
      h("div", { class: "gap" }, h("div", { class: "company" }, `${icon[g.status] ?? "•"} ${g.requirement}`), h("div", { class: "meta" }, g.note)))));
  }
  return view;
}

function routeFromHash() {
  const m = /^#\/app\/([0-9a-f-]{36})$/i.exec(location.hash);
  state.detail = m ? m[1] : null;
}

async function render(keepScroll = false) {
  routeFromHash();
  if (state.detail) {
    $("head-title").textContent = "Bewerbung";
    $("head-sub").textContent = "";
    document.querySelectorAll("nav button").forEach((b) => b.removeAttribute("aria-current"));
    const id = state.detail;
    const content = await renderDetail(id);
    if (state.detail === id) $("view").replaceChildren(content);
    if (!keepScroll) window.scrollTo(0, 0);
    return;
  }
  $("head-title").textContent = TITLES[state.tab];
  const d = state.data;
  $("head-sub").textContent = state.tab === "jobs" ? `${d.jobs.length} passende Stellen` : state.tab === "apps" ? `${d.applications.length} Einträge` : "";
  document.querySelectorAll("nav button").forEach((b) => {
    if (b.dataset.tab === state.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  $("view").replaceChildren(state.tab === "apps" ? renderApps() : state.tab === "jobs" ? renderJobs() : renderStatus());
}

document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => {
  state.tab = b.dataset.tab;
  if (location.hash) { location.hash = ""; return; }
  if (state.data) { render(); window.scrollTo(0, 0); }
}));
window.addEventListener("hashchange", () => { if (state.data) render(); });
$("refresh").addEventListener("click", load);
$("login-form").addEventListener("submit", (e) => { e.preventDefault(); store.set("pw", $("pw").value); $("pw").value = ""; load(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && store.get("pw")) load(); });
load();
</script>
</body>
</html>
