name: BA probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Show v6 response shape
        run: |
          base=https://rest.arbeitsagentur.de/jobboerse/jobsuche-service
          h="X-API-Key: jobboerse-jobsuche"
          curl -sS -m 30 -H "$h" "$base/pc/v6/jobs?was=Werkstudent%20Informatik&wo=Darmstadt&umkreis=50&size=1" -o s.json -w "search HTTP %{http_code}\n"
          python3 - <<'PY'
          import json
          d = json.load(open("s.json"))
          print({k: (v if k != "ergebnisliste" else f"<{len(v)} items>") for k, v in d.items()})
          print(json.dumps(d["ergebnisliste"][0], indent=1, ensure_ascii=False)[:3000])
          PY
          for p in "pc/v6/jobdetails" "pc/v4/jobdetails"; do
            ref=$(python3 -c "import json,base64;d=json.load(open('s.json'))['ergebnisliste'][0];print(base64.b64encode(d.get('referenznummer', d.get('refnr','')).encode()).decode())")
            echo "== $p"
            curl -sS -m 30 -H "$h" "$base/$p/$ref" -o d.json -w "HTTP %{http_code}\n"
            head -c 1500 d.json; echo
          done
          echo "== page 2 and filters"
          curl -sS -m 30 -H "$h" "$base/pc/v6/jobs?was=Werkstudent&wo=Darmstadt&umkreis=50&size=50&page=2" -o p2.json -w "p2 HTTP %{http_code}\n"
          python3 -c "import json;d=json.load(open('p2.json'));print({k:(v if k!='ergebnisliste' else len(v)) for k,v in d.items()})"
