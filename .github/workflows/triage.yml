name: Triage

on:
  schedule:
    - cron: "30 5 * * *" # 07:30 Berlin in summer, 06:30 in winter, well before the 09:00 digest
  workflow_dispatch:
    inputs:
      notify:
        description: Send Telegram messages (turn off for a dry run)
        type: boolean
        default: true

concurrency:
  group: triage
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Run triage
        run: |
          args=""
          if [ "${{ inputs.notify }}" = "false" ]; then args="--no-notify"; fi
          # Manual runs are for testing, so they ignore the notification pause.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            args="$args --ignore-pause"
          fi
          job-scout triage $args
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROFILE_YAML: ${{ secrets.PROFILE_YAML }}
