name: Digest

on:
  schedule:
    # One run a day, no clock guard: GitHub often starts scheduled runs 6 to 8 hours late, and a
    # guard on the local hour then skipped every digest. 02:00 UTC is planned so that the late
    # start lands in the Berlin morning.
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Send digest
        # Manual runs are for testing, so they ignore the notification pause.
        run: job-scout digest ${{ github.event_name == 'workflow_dispatch' && '--ignore-pause' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
