[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-scout-agent"
version = "0.1.0"
description = "Finds, scores and delivers Forward-Deployed-Engineer-style job postings, and builds tailored application packages on request."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.60",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "supabase>=2.5",
    "jinja2>=3.1",
    "python-telegram-bot>=21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
job-scout = "job_scout.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/job_scout"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
